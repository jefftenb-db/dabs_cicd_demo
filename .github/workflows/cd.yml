# CD: runs when changes are merged to main.
#   1. Re-run unit tests on the merged code.
#   2. After manual approval on the 'prod' GitHub environment, validate, build, deploy,
#      and run the bundle in the prod workspace as the prod service principal (OAuth M2M).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run pytest -v

  deploy-prod:
    name: deploy-prod
    needs: unit-tests
    # The FEVM workspaces only accept allowlisted IPs, so deploys run on a self-hosted runner
    # (with the Databricks CLI and uv preinstalled) inside the allowlisted network.
    runs-on: [self-hosted, databricks-deploy]
    environment: prod
    concurrency:
      group: prod
      cancel-in-progress: false
    env:
      # OAuth M2M as the environment's service principal. Host and client ID are environment
      # variables; the client secret is an environment secret.
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Ignore any personal ~/.databrickscfg on the runner machine
        run: echo "DATABRICKS_CONFIG_FILE=$RUNNER_TEMP/no-databrickscfg" >> "$GITHUB_ENV"
      - name: Who am I
        run: databricks current-user me
      - name: Validate bundle
        run: databricks bundle validate --strict -t prod
      - name: Build and deploy bundle
        run: databricks bundle deploy -t prod
      - name: Run job
        run: databricks bundle run wanderbricks_daily_report -t prod
