# CD: runs when changes are merged to main.
#   1. Re-run unit tests on the merged code.
#   2. After manual approval on the 'prod' GitHub environment, validate, build, deploy,
#      and run the bundle in the prod workspace as the prod service principal (GitHub OIDC).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to request the GitHub OIDC token for Databricks
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run pytest -v

  deploy-prod:
    name: deploy-prod
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod
      cancel-in-progress: false
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - name: Who am I
        run: databricks current-user me
      - name: Validate bundle
        run: databricks bundle validate --strict -t prod
      - name: Build and deploy bundle
        run: databricks bundle deploy -t prod
      - name: Run job
        run: databricks bundle run wanderbricks_daily_report -t prod
