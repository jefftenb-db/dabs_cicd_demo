# CI: runs on every pull request to main.
#   1. Unit tests with pytest on local Spark (no Databricks credentials needed).
#   2. Validate, build, deploy, and run the bundle in the staging target (dev workspace)
#      as the staging service principal, authenticated with GitHub OIDC (no stored secrets).
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write # required to request the GitHub OIDC token for Databricks
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run pytest -v

  deploy-staging:
    name: deploy-staging
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: staging
    # Only one staging deployment at a time; staging is shared by all PRs.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - name: Who am I
        run: databricks current-user me
      - name: Validate bundle
        run: databricks bundle validate --strict -t staging
      - name: Build and deploy bundle
        run: databricks bundle deploy -t staging
      - name: Run job (integration test)
        run: databricks bundle run wanderbricks_daily_report -t staging
