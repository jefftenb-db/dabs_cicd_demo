# CI: runs on every pull request to main.
#   1. Unit tests with pytest on local Spark (no Databricks credentials needed).
#   2. Validate, build, deploy, and run the bundle in the staging target (dev workspace)
#      as the staging service principal (OAuth M2M).
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run pytest -v

  deploy-staging:
    name: deploy-staging
    needs: unit-tests
    # The FEVM workspaces only accept allowlisted IPs, so deploys run on a self-hosted runner
    # (with the Databricks CLI and uv preinstalled) inside the allowlisted network.
    runs-on: [self-hosted, databricks-deploy]
    # Never run fork PRs on the self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: staging
    # Only one staging deployment at a time; staging is shared by all PRs.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      # OAuth M2M as the environment's service principal. Host and client ID are environment
      # variables; the client secret is an environment secret.
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # Select the bundle target for every CLI call. Without it, CLI commands run in the bundle
      # folder resolve the workspace host from the default (dev) target.
      DATABRICKS_BUNDLE_TARGET: staging
    steps:
      - uses: actions/checkout@v4
      - name: Ignore any personal ~/.databrickscfg on the runner machine
        run: echo "DATABRICKS_CONFIG_FILE=$RUNNER_TEMP/no-databrickscfg" >> "$GITHUB_ENV"
      - name: Who am I
        run: databricks current-user me
      - name: Validate bundle
        run: databricks bundle validate --strict -t staging
      - name: Build and deploy bundle
        run: databricks bundle deploy -t staging
      - name: Run job (integration test)
        run: databricks bundle run wanderbricks_daily_report -t staging
