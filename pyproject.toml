[project]
name = "dabs_cicd_demo"
version = "0.0.1"
authors = [{ name = "jeff.tenbosch@databricks.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # pyspark is provided by the serverless runtime, so it is only a dev dependency.
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # Local Spark for unit tests (runs on the GitHub Actions runner, no workspace needed).
    "pyspark>=4.0,<4.1",
]

[project.scripts]
main = "dabs_cicd_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dabs_cicd_demo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
